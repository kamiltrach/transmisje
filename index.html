<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strefa Gola — Transmisje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<style>
:root {
  --navy: #0b162c;
  --green: #7ed321;
  --gold: #f5a623;
  --white: #fff;
  --muted: #8b9bb4;
  --border: rgba(255,255,255,.08);
  --glass: rgba(19,34,64,.72);
  --glow: rgba(126,211,33,.25);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--navy);
  color: #fff;
  font-family: Inter, sans-serif;
  background-image: 
    radial-gradient(circle at 8% 8%, rgba(126,211,33,.08), transparent 34%),
    radial-gradient(circle at 92% 92%, rgba(245,166,35,.06), transparent 34%);
}

button, input { font: inherit; }
button { cursor: pointer; color: inherit; border: 0; }
h1, h2, h3 { font-family: Outfit, sans-serif; }

.topbar {
  height: 76px;
  position: fixed;
  inset: 0 0 auto;
  z-index: 20;
  background: rgba(11,22,44,.94);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4%;
}

.brand { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; }
.brand img { height: 46px; width: auto; }
.brand-title { font: 800 1.1rem Outfit; text-transform: uppercase; color: #fff; line-height: 1; }
.brand-title .gola { color: var(--green); }
.brand-sub { font: 700 .55rem Outfit; color: var(--muted); letter-spacing: 2.4px; margin-top: 4px; text-transform: uppercase; }

main { max-width: 1220px; margin: 0 auto; padding: 100px 20px 50px; }
.hero { text-align: center; padding: 2rem 0 1.5rem; }
.hero h1 { font-size: 2.5rem; text-transform: uppercase; letter-spacing: 1.2px; }
.live-dot {
  display: inline-flex; align-items: center; gap: 7px; color: #fff; font-size: .68rem;
  font-weight: 700; padding: 7px 11px; border: 1px solid var(--border); border-radius: 999px;
  background: rgba(255,255,255,.04); margin-top: 10px;
}
.live-dot i { color: var(--green); font-size: .5rem; }

.leagues { display: flex; gap: 8px; overflow: auto; padding: 10px 0; scrollbar-width: none; }
.leagues::-webkit-scrollbar { display: none; }
.league {
  white-space: nowrap; padding: 10px 16px; border-radius: 10px; background: rgba(255,255,255,.04);
  border: 1px solid var(--border); color: var(--muted); font-size: .75rem; font-weight: 700; transition: .2s;
}
.league:hover { color: #fff; background: rgba(255,255,255,.08); }
.league.active { background: var(--green); border-color: var(--green); color: var(--navy); box-shadow: 0 0 20px var(--glow); }

/* SEKCJA ODTWARZACZA */
.player-card {
  position: relative; background: #000; border: 1px solid var(--border);
  border-radius: 20px; overflow: hidden; box-shadow: 0 25px 70px #0008; margin-top: 10px;
}

.video-container {
  position: relative; width: 100%; aspect-ratio: 16/9; min-height: 320px;
  background: #050b14; overflow: hidden; display: flex; align-items: center; justify-content: center;
}

/* Przycięcie ramek Twitcha (maskowanie nagłówków i logo) */
.player-frame-wrapper {
  position: absolute;
  inset: -6.5% -1.5% -6.5% -1.5%;
  width: 103%; height: 113%;
}

.player-frame-wrapper iframe { width: 100%; height: 100%; border: 0; }

.watermark {
  position: absolute; right: 20px; top: 18px; z-index: 10;
  background: rgba(11,22,44,.85); padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--border); pointer-events: none;
}
.watermark img { height: 30px; display: block; }

/* Nakładka aktywacji dźwięku (Autoplay fix) */
.unmute-overlay {
  position: absolute; inset: 0; z-index: 15;
  background: rgba(5, 11, 20, 0.6); backdrop-filter: blur(4px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  transition: opacity .3s ease, visibility .3s;
}
.unmute-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.unmute-btn {
  padding: 14px 28px; border-radius: 50px; background: var(--green);
  color: var(--navy); font-weight: 800; font-size: .85rem; text-transform: uppercase;
  box-shadow: 0 8px 25px rgba(126,211,33,.4); display: flex; align-items: center; gap: 10px;
  transition: transform .2s ease;
}
.unmute-btn:hover { transform: scale(1.05); }

.placeholder { text-align: center; color: var(--muted); z-index: 2; padding: 20px; }
.placeholder i { font-size: 2.5rem; color: var(--green); margin-bottom: 12px; }

/* Pasek sterowania */
.controls-bar {
  height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
  background: rgba(8,16,31,.98); border-top: 1px solid var(--border); position: relative; z-index: 20;
}
.btn-ctrl {
  width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.05);
  color: #c9d2df; display: grid; place-items: center; transition: .2s;
}
.btn-ctrl:hover { background: rgba(126,211,33,.15); color: var(--green); }
.stream-title { font-size: .8rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }

/* Panel Admina */
.admin-panel {
  display: none; position: fixed; left: 50%; top: 85px; transform: translateX(-50%);
  width: min(1100px, calc(100% - 24px)); max-height: calc(100vh - 100px); overflow: auto;
  z-index: 100; background: rgba(11,22,44,.98); border: 1px solid var(--border);
  border-radius: 18px; padding: 24px; box-shadow: 0 20px 60px #0008;
}
.admin-panel.open { display: block; }
.admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 15px; }
.admin-card { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.admin-card input[type="text"] {
  width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
  background: rgba(0,0,0,.4); color: #fff; margin-top: 4px; margin-bottom: 8px; font-size: .8rem;
}
.save-btn {
  width: 100%; padding: 10px; border-radius: 8px; background: var(--green);
  color: var(--navy); font-weight: 800; text-transform: uppercase; font-size: .7rem;
}

.toast { position: fixed; right: 20px; bottom: 20px; z-index: 200; padding: 12px 18px; border-radius: 10px; background: #132240; border: 1px solid var(--border); font-size: .75rem; display: none; }
.toast.show { display: block; }

@media(max-width: 700px) {
  .hero h1 { font-size: 1.8rem; }
  .stream-title { max-width: 130px; }
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#">
    <img src="logo.png" onerror="this.style.display='none'" alt="Logo">
    <div>
      <div class="brand-title">STREFA <span class="gola">GOLA</span></div>
      <div class="brand-sub">PODKARPACIE</div>
    </div>
  </a>
</header>

<main>
  <section class="hero">
    <h1>Transmisje na żywo</h1>
    <div class="live-dot"><i class="fa-solid fa-circle"></i> NA ŻYWO</div>
  </section>

  <div id="leagues" class="leagues"></div>

  <section class="player-card">
    <div id="videoContainer" class="video-container">
      
      <!-- Placeholder kiedy transmisja nie działa -->
      <div id="placeholder" class="placeholder">
        <i class="fa-solid fa-tower-broadcast"></i>
        <h2>Wybierz mecz z listy</h2>
        <p>Wybierz ligę powyżej, aby uruchomić odtwarzacz.</p>
      </div>

      <!-- Przycisk odblokowania audio (pojawia się po załadowaniu) -->
      <div id="unmuteOverlay" class="unmute-overlay hidden">
        <button class="unmute-btn" onclick="unmuteStream()">
          <i class="fa-solid fa-volume-high"></i> Kliknij, aby włączyć dźwięk
        </button>
      </div>

      <!-- Znak wodny -->
      <div class="watermark"><img src="logo.png" alt="Strefa Gola"></div>
    </div>

    <!-- Pasek sterowania -->
    <div class="controls-bar">
      <button class="btn-ctrl" id="playBtn" onclick="togglePlay()" title="Odtwórz / Pauza"><i class="fa-solid fa-play"></i></button>
      <button class="btn-ctrl" id="muteBtn" onclick="toggleMute()" title="Wycisz / Włącz dźwięk"><i id="muteIcon" class="fa-solid fa-volume-xmark"></i></button>
      <div class="stream-title" id="streamTitle">Brak transmisji</div>
      <div class="spacer"></div>
      <button class="btn-ctrl" onclick="toggleFullscreen()" title="Pełny ekran"><i class="fa-solid fa-expand"></i></button>
    </div>
  </section>

  <!-- Panel Zarządzania -->
  <section id="adminPanel" class="admin-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>Zarządzanie Linkami Transmisji</h3>
      <button class="btn-ctrl" onclick="closeAdmin()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="adminGrid" class="admin-grid"></div>
  </section>
</main>

<div id="toast" class="toast"></div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const L = {
  iv_liga: 'IV Liga Podkarpacka',
  okr_jaroslaw: 'Klasa Okręgowa Jarosław',
  okr_krosno: 'Klasa Okręgowa Krosno',
  okr_rzeszow: 'Klasa Okręgowa Rzeszów',
  okr_debica: 'Klasa Okręgowa Dębica',
  okr_stalowa: 'Klasa Okręgowa Stalowa Wola',
  a_przeworsk: 'A Klasa Przeworsk',
  b_przeworsk: 'B Klasa Przeworsk'
};

let streams = {}, activeLeague = null, twitchPlayer = null;

function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function getHostDomain() {
  let host = window.location.hostname;
  return (host && host !== '') ? host : 'localhost';
}

function extractChannelName(url) {
  if (!url) return '';
  const match = String(url).match(/twitch\.tv\/([^/?#]+)/i);
  return match ? match[1].trim() : url.trim();
}

function renderLeagues() {
  document.getElementById('leagues').innerHTML = Object.entries(L).map(([k, v]) => 
    `<button class="league ${k === activeLeague ? 'active' : ''}" onclick="selectLeague('${k}')">${v}</button>`
  ).join('');
}

function selectLeague(key) {
  activeLeague = key;
  renderLeagues();
  loadStream();
}

function destroyPlayer() {
  const oldFrame = document.getElementById('twitchWrapper');
  if (oldFrame) oldFrame.remove();
  twitchPlayer = null;
  document.getElementById('unmuteOverlay').classList.add('hidden');
}

function loadStream() {
  destroyPlayer();
  const data = streams[activeLeague];
  const titleEl = document.getElementById('streamTitle');
  const placeholder = document.getElementById('placeholder');

  titleEl.textContent = data?.title || L[activeLeague] || 'Transmisja';

  if (!data?.active || !data?.videoId) {
    placeholder.style.display = 'block';
    return;
  }

  placeholder.style.display = 'none';

  // Tworzenie kontenera dla podglądu Twitch
  const container = document.getElementById('videoContainer');
  const wrapper = document.createElement('div');
  wrapper.id = 'twitchWrapper';
  wrapper.className = 'player-frame-wrapper';
  
  const playerDiv = document.createElement('div');
  playerDiv.id = 'twitchEmbedTarget';
  playerDiv.style.width = '100%';
  playerDiv.style.height = '100%';
  
  wrapper.appendChild(playerDiv);
  container.appendChild(wrapper);

  // Inicjalizacja Twitch JS Embed
  try {
    twitchPlayer = new Twitch.Player('twitchEmbedTarget', {
      channel: extractChannelName(data.videoId),
      parent: [getHostDomain()],
      autoplay: true,
      muted: true // Autoplay wymusza start z wyciszeniem
    });

    twitchPlayer.addEventListener(Twitch.Player.READY, () => {
      twitchPlayer.play();
      twitchPlayer.setMuted(true);
      
      // Pokaż przycisk włączenia dźwięku
      document.getElementById('unmuteOverlay').classList.remove('hidden');
      updateUIState(true, true);
    });

    twitchPlayer.addEventListener(Twitch.Player.PLAY, () => updateUIState(false, twitchPlayer.getMuted()));
    twitchPlayer.addEventListener(Twitch.Player.PAUSE, () => updateUIState(true, twitchPlayer.getMuted()));

  } catch(e) {
    console.error("Błąd tworzenia odtwarzacza:", e);
  }
}

function unmuteStream() {
  if (!twitchPlayer) return;
  twitchPlayer.setMuted(false);
  twitchPlayer.setVolume(1.0);
  document.getElementById('unmuteOverlay').classList.add('hidden');
  updateUIState(false, false);
}

function togglePlay() {
  if (!twitchPlayer) return;
  if (twitchPlayer.isPaused()) {
    twitchPlayer.play();
  } else {
    twitchPlayer.pause();
  }
}

function toggleMute() {
  if (!twitchPlayer) return;
  const isMuted = twitchPlayer.getMuted();
  twitchPlayer.setMuted(!isMuted);
  if (isMuted) twitchPlayer.setVolume(1.0);
  document.getElementById('unmuteOverlay').classList.add('hidden');
  updateUIState(twitchPlayer.isPaused(), !isMuted);
}

function updateUIState(isPaused, isMuted) {
  document.getElementById('playBtn').innerHTML = isPaused 
    ? '<i class="fa-solid fa-play"></i>' 
    : '<i class="fa-solid fa-pause"></i>';
    
  document.getElementById('muteIcon').className = isMuted 
    ? 'fa-solid fa-volume-xmark' 
    : 'fa-solid fa-volume-high';
}

function toggleFullscreen() {
  const el = document.getElementById('videoContainer');
  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
}

async function fetchStreams() {
  try {
    if (window.db) {
      const snap = await window.db.collection('streams').get();
      streams = {};
      snap.forEach(doc => streams[doc.id] = doc.data());
    }
  } catch (e) {
    console.warn("Błąd Firebase:", e);
  }

  const activeKey = Object.keys(L).find(k => streams[k]?.active && streams[k]?.videoId);
  activeLeague = activeKey || Object.keys(L)[0];

  renderLeagues();
  loadStream();
}

function openAdmin() { document.getElementById('adminPanel').classList.add('open'); renderAdmin(); }
function closeAdmin() { document.getElementById('adminPanel').classList.remove('open'); }

function renderAdmin() {
  document.getElementById('adminGrid').innerHTML = Object.entries(L).map(([k, v]) => {
    const s = streams[k] || {};
    return `
      <div class="admin-card">
        <strong>${v}</strong>
        <input type="text" id="t_${k}" value="${s.title || v}" placeholder="Tytuł transmisji">
        <input type="text" id="u_${k}" value="${s.url || s.videoId || ''}" placeholder="Link do Twitcha">
        <label><input type="checkbox" id="a_${k}" ${s.active ? 'checked' : ''}> Aktywna</label>
        <button class="save-btn" style="margin-top:8px" onclick="saveStream('${k}')">Zapisz</button>
      </div>`;
  }).join('');
}

async function saveStream(k) {
  const url = document.getElementById('u_' + k).value.trim();
  const channel = extractChannelName(url);
  const data = {
    league: k,
    title: document.getElementById('t_' + k).value.trim() || L[k],
    url: url,
    videoId: channel,
    active: document.getElementById('a_' + k).checked
  };

  try {
    if (window.db) await window.db.collection('streams').doc(k).set(data, { merge: true });
    streams[k] = data;
    toast('Zapisano pomyślnie!');
    if (activeLeague === k) loadStream();
  } catch (e) {
    toast('Błąd zapisu bazy danych.');
  }
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'm') {
    e.preventDefault();
    openAdmin();
  }
});

document.addEventListener('DOMContentLoaded', fetchStreams);
</script>
</body>
</html>
