<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strefa Gola — Odtwarzacz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Biblioteka do obsługi strumieni HLS (.m3u8) w natywnym HTML5 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b162c; font-family: sans-serif; display: grid; place-items: center; min-height: 100vh; }

  /* Autorski kontener odtwarzacza */
  .custom-player {
    position: relative;
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.1);
  }

  video { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Znak wodny Twojej marki */
  .brand-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(11, 22, 44, 0.8);
    backdrop-filter: blur(8px);
    padding: 6px 12px;
    border-radius: 8px;
    color: #7ed321;
    font-weight: bold;
    font-size: 0.8rem;
    pointer-events: none;
  }

  /* Autorski pasek sterowania w HTML/CSS */
  .controls-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 10;
  }

  .custom-player:hover .controls-overlay { opacity: 1; }

  .btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    transition: color 0.2s;
  }
  .btn:hover { color: #7ed321; }

  .volume-slider {
    width: 80px;
    accent-color: #7ed321;
    cursor: pointer;
  }

  .spacer { flex: 1; }
</style>
</head>
<body>

<div class="custom-player">
  <div class="brand-badge"><i class="fa-solid fa-circle" style="font-size:0.5rem;"></i> STREFA GOLA LIVE</div>
  
  <video id="video" autoplay muted playsinline></video>

  <!-- Twój własny interfejs, zero śladów stron trzecich -->
  <div class="controls-overlay">
    <button class="btn" id="playBtn" onclick="togglePlay()"><i class="fa-solid fa-pause"></i></button>
    <button class="btn" id="muteBtn" onclick="toggleMute()"><i class="fa-solid fa-volume-xmark"></i></button>
    <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.1" value="0" oninput="changeVolume(this.value)">
    <div class="spacer"></div>
    <button class="btn" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const playBtn = document.getElementById('playBtn');
  const muteBtn = document.getElementById('muteBtn');

  // Podmień na bezpośredni link .m3u8 swojego streamu (np. z własnego serwera RTMP/HLS)
  const streamUrl = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';

  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = streamUrl;
  }

  function togglePlay() {
    if (video.paused) {
      video.play();
      playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
    } else {
      video.pause();
      playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
    }
  }

  function toggleMute() {
    video.muted = !video.muted;
    muteBtn.innerHTML = video.muted 
      ? '<i class="fa-solid fa-volume-xmark"></i>' 
      : '<i class="fa-solid fa-volume-high"></i>';
  }

  function changeVolume(val) {
    video.volume = val;
    video.muted = val == 0;
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      video.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }
</script>

</body>
</html>
